<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("theme");if(!t&&matchMedia("(prefers-color-scheme: dark)").matches)t="dark";if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Attendance | Izabela Dorinne P. Ronquillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F5F8FF; --surface:#FFFFFF; --ink:#23305A; --soft:#69769A; --line:#E0E7F6;
  --sky:#DCE8FC; --lav:#ECE8FD;
  --accent:#7C6CF0; --accent-dark:#6154D4; --on-accent:#FFFFFF;
  --blob1:#CFE0FF; --blob2:#DDD3FB; --blob3:#CDE6FB; --blob-o:.6; --sq2:var(--sq2); --ring:var(--ring); --th:#F7F6FF; --row-hover:#F5F8FF; --err:#C0504D;
  --serif:'DM Serif Display',Georgia,serif; --sans:'Nunito Sans','Segoe UI',sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1426; --surface:#151D36; --ink:#E8ECFA; --soft:#9AA7C9; --line:#26304F;
  --sky:#1E2D55; --lav:#2A2455;
  --accent:#9B8CFF; --accent-dark:#B3A8FF; --on-accent:#14122E;
  --blob1:#1F3A7A; --blob2:#3B2F8A; --blob3:#1B4A7A; --blob-o:.32; --sq2:#6E62D6; --ring:#3A3470; --th:#1A2346; --row-hover:#1B2547; --err:#FF8A87;
}
body,.card,.btn,.theme{transition:background-color .35s,border-color .35s,color .35s}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.02rem;line-height:1.7}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:44px 32px 90px}

/* background */
.blobs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob-o);animation:drift 18s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:400px;height:400px;background:var(--blob1);top:-90px;left:-110px}
.blobs i:nth-child(2){width:360px;height:360px;background:var(--blob2);top:40%;right:-120px;animation-duration:23s;animation-delay:-6s}
.blobs i:nth-child(3){width:320px;height:320px;background:var(--blob3);bottom:-110px;left:35%;animation-duration:20s;animation-delay:-11s}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
.btn{position:relative;overflow:hidden;display:inline-block;text-decoration:none;font:inherit;font-weight:600;font-size:.92rem;padding:10px 24px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:999px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.btn:hover{background:var(--accent-dark);border-color:var(--accent-dark);transform:translateY(-2px)}
.btn.line{background:var(--surface);color:var(--accent-dark);border-color:var(--line)}
.btn.line:hover{background:var(--sky);border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:wait}

/* heading */
.head{position:relative;margin:54px 0 28px;animation:rise .8s cubic-bezier(.2,.7,.2,1) .1s backwards}
.head::before{content:"";display:block;width:8px;height:8px;margin-bottom:14px;background:var(--accent);box-shadow:11px 0 0 #A99DF7,22px 0 0 var(--ring)}
.head h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,6vw,4rem);line-height:1.1;margin:0 0 8px;background:linear-gradient(100deg,var(--ink) 25%,var(--accent) 55%,#5B8DEF 80%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s ease-in-out infinite alternate}
.head p{margin:0;color:var(--soft);font-size:1.1rem}
.head::after{content:"";position:absolute;right:30px;top:0;width:54px;height:54px;border-radius:50%;border:1.5px solid var(--ring);pointer-events:none}

/* table card */
.card{min-height:460px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px -35px rgba(124,108,240,.45);overflow:hidden;animation:rise .8s cubic-bezier(.2,.7,.2,1) .2s backwards}
.card-bar{display:flex;justify-content:space-between;align-items:center;padding:22px 32px;border-bottom:1px solid var(--line)}
.badge{font-size:.85rem;font-weight:600;padding:3px 14px;border-radius:999px;background:var(--lav);color:var(--accent-dark)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px;font-size:1.05rem}
th,td{padding:18px 32px;text-align:left;white-space:nowrap}
th{font-weight:600;font-size:.95rem;color:var(--accent-dark);background:var(--th);text-transform:capitalize}
td{border-top:1px solid var(--line);color:var(--ink)}
tbody tr{transition:background .2s}
tbody tr:hover{background:var(--row-hover)}
tbody tr{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}

/* states */
.state{padding:120px 22px;font-size:1.1rem;text-align:center;color:var(--soft);margin:0}
.state.err{color:var(--err)}
.skeleton{padding:32px;display:grid;gap:20px}
.skeleton i{display:block;height:22px;border-radius:10px;background:linear-gradient(90deg,var(--lav),var(--th),var(--lav));background-size:200% 100%;animation:sk 1.4s linear infinite}
.skeleton i:nth-child(2){width:85%}.skeleton i:nth-child(3){width:70%}.skeleton i:nth-child(4){width:90%}

/* theme toggle + back to top */
.right{display:flex;align-items:center;gap:12px}
.theme{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent-dark);cursor:pointer;transition:transform .25s,background .2s,border-color .2s}
.theme:hover{background:var(--sky);border-color:var(--accent);transform:rotate(18deg)}
.theme svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}
:root[data-theme="dark"] .theme .moon{display:none}
.totop{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:15;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;box-shadow:0 14px 30px -12px rgba(124,108,240,.7);opacity:0;transform:translateY(16px) scale(.9);pointer-events:none;transition:opacity .3s,transform .3s,background .2s}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop:hover{background:var(--accent-dark);transform:translateY(-3px)}
.totop svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes shine{to{background-position:100% 0}}
@keyframes drift{to{transform:translate(60px,80px) scale(1.15)}}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:640px){.wrap{padding:28px 18px 80px}.head::after{display:none}th,td{padding:14px 18px}.card-bar{padding:16px 18px}.card{min-height:380px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="wrap">
  <div class="top">
    <a class="btn line" href="index.html">← Back</a>
    <div class="right">
      <span class="badge" id="count" hidden></span>
      <button class="theme" id="themeBtn" type="button" aria-label="Switch to dark mode" aria-pressed="false">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>

  <div class="head">
    <h1>Daily Attendance</h1>
    <p>Live records from the student API.</p>
  </div>

  <div class="card">
    <div class="card-bar">
      <strong>Records</strong>
      <button class="btn" id="refreshBtn" type="button">Refresh</button>
    </div>
    <div id="daily_attendanceContainer" aria-live="polite">
      <div class="skeleton"><i></i><i></i><i></i><i></i></div>
    </div>
  </div>
</div>

<button class="totop" id="toTop" type="button" aria-label="Back to top"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>

<script>
  const VERCEL_API_URL = 'https://student-api-backend-mu.vercel.app/api/daily_attendance';
  const container = document.getElementById('daily_attendanceContainer');
  const countEl = document.getElementById('count');
  const refreshBtn = document.getElementById('refreshBtn');

  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const label = (k) => k.replace(/_/g, ' ');

  async function loadRecords() {
    refreshBtn.disabled = true;
    container.innerHTML = '<div class="skeleton"><i></i><i></i><i></i><i></i></div>';
    try {
      const response = await fetch(VERCEL_API_URL);
      if (!response.ok) throw new Error('Request failed');
      const records = await response.json();

      if (!records.length) {
        container.innerHTML = '<p class="state">No attendance records found.</p>';
        countEl.hidden = true;
        return;
      }

      const keys = Object.keys(records[0]).filter(k => !k.startsWith('_') && k !== '__v');
      let html = '<div class="scroll"><table><thead><tr>' + keys.map(k => '<th>' + esc(label(k)) + '</th>').join('') + '</tr></thead><tbody>';
      records.forEach((r, i) => {
        html += '<tr style="--i:' + Math.min(i, 12) + '">' + keys.map(k => '<td>' + esc(r[k]) + '</td>').join('') + '</tr>';
      });
      html += '</tbody></table></div>';
      container.innerHTML = html;

      countEl.textContent = records.length + (records.length === 1 ? ' record' : ' records');
      countEl.hidden = false;
    } catch (error) {
      container.innerHTML = '<p class="state err">Error loading records. Check your connection and press Refresh.</p>';
      countEl.hidden = true;
    } finally {
      refreshBtn.disabled = false;
    }
  }

  refreshBtn.addEventListener('click', loadRecords);
  loadRecords();

  // ----- Dark mode (shared with the portfolio) -----
  const root = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  function syncTheme() {
    const dark = root.dataset.theme === 'dark';
    themeBtn.setAttribute('aria-pressed', dark);
    themeBtn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  themeBtn.addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
    syncTheme();
  });
  syncTheme();

  // ----- Back to top -----
  const toTop = document.getElementById('toTop');
  toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  addEventListener('scroll', () => toTop.classList.toggle('show', scrollY > 400), { passive: true });
</script>
</body>
</html>
