<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        input, button { display: block; width: 100%; margin-bottom: 10px; padding: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <h2><a href="index.html">Back</a></h2>
    <h2>Daily Attendance</h2>
    <div id="recordsContainer">Loading...</div>
    <script>
        const VERCEL_API_URL = 'https://student-api-backend-mu.vercel.app/api/daily_attendance';
        async function loadRecords() {
            try {
                const response = await fetch(VERCEL_API_URL);
                const records = await response.json();
                const container = document.getElementById('recordsContainer');
                container.innerHTML = '';
                if (!records.length) { container.innerHTML = '<p>No attendance records found.</p>'; return; }
                const keys = Object.keys(records[0]).filter(k => !k.startsWith('_') && k !== '__v');
                let html = '<table><thead><tr>' + keys.map(k => '<th>' + k + '</th>').join('') + '</tr></thead><tbody>';
                records.forEach(r => {
                    html += '<tr>' + keys.map(k => '<td>' + (r[k] ?? '') + '</td>').join('') + '</tr>';
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (error) {
                document.getElementById('recordsContainer').innerText = 'Error loading records.';
            }
        }
        loadRecords();
    </script>
</body>
</html>
