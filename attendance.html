<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Attendance | Izabela Dorinne P. Ronquillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F5F8FF; --surface:#FFFFFF; --ink:#23305A; --soft:#69769A; --line:#E0E7F6;
  --sky:#DCE8FC; --lav:#ECE8FD;
  --accent:#7C6CF0; --accent-dark:#6154D4; --on-accent:#FFFFFF;
  --serif:'DM Serif Display',Georgia,serif; --sans:'Nunito Sans','Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.02rem;line-height:1.7}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:36px 24px 70px}

/* background */
.blobs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;animation:drift 18s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:400px;height:400px;background:#CFE0FF;top:-90px;left:-110px}
.blobs i:nth-child(2){width:360px;height:360px;background:#DDD3FB;top:40%;right:-120px;animation-duration:23s;animation-delay:-6s}
.blobs i:nth-child(3){width:320px;height:320px;background:#CDE6FB;bottom:-110px;left:35%;animation-duration:20s;animation-delay:-11s}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
.btn{position:relative;overflow:hidden;display:inline-block;text-decoration:none;font:inherit;font-weight:600;font-size:.92rem;padding:10px 24px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:999px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.btn:hover{background:var(--accent-dark);border-color:var(--accent-dark);transform:translateY(-2px)}
.btn.line{background:var(--surface);color:var(--accent-dark);border-color:var(--line)}
.btn.line:hover{background:var(--sky);border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:wait}

/* heading */
.head{position:relative;margin:54px 0 28px;animation:rise .8s cubic-bezier(.2,.7,.2,1) .1s backwards}
.head::before{content:"";display:block;width:8px;height:8px;margin-bottom:14px;background:var(--accent);box-shadow:11px 0 0 #A99DF7,22px 0 0 #D3CCF9}
.head h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.1;margin:0 0 8px;background:linear-gradient(100deg,var(--ink) 25%,var(--accent) 55%,#5B8DEF 80%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s ease-in-out infinite alternate}
.head p{margin:0;color:var(--soft)}
.head::after{content:"";position:absolute;right:30px;top:0;width:54px;height:54px;border-radius:50%;border:1.5px solid #D3CCF9;pointer-events:none}

/* table card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px -35px rgba(124,108,240,.45);overflow:hidden;animation:rise .8s cubic-bezier(.2,.7,.2,1) .2s backwards}
.card-bar{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.badge{font-size:.85rem;font-weight:600;padding:3px 14px;border-radius:999px;background:var(--lav);color:var(--accent-dark)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:14px 22px;text-align:left;white-space:nowrap}
th{font-weight:600;font-size:.88rem;color:var(--accent-dark);background:#F7F6FF;text-transform:capitalize}
td{border-top:1px solid var(--line);color:var(--ink)}
tbody tr{transition:background .2s}
tbody tr:hover{background:#F5F8FF}
tbody tr{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}

/* states */
.state{padding:48px 22px;text-align:center;color:var(--soft);margin:0}
.state.err{color:#C0504D}
.skeleton{padding:22px;display:grid;gap:14px}
.skeleton i{display:block;height:16px;border-radius:8px;background:linear-gradient(90deg,var(--lav),#F7F6FF,var(--lav));background-size:200% 100%;animation:sk 1.4s linear infinite}
.skeleton i:nth-child(2){width:85%}.skeleton i:nth-child(3){width:70%}.skeleton i:nth-child(4){width:90%}

@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes shine{to{background-position:100% 0}}
@keyframes drift{to{transform:translate(60px,80px) scale(1.15)}}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:640px){.head::after{display:none}th,td{padding:12px 16px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="wrap">
  <div class="top">
    <a class="btn line" href="index.html">← Back</a>
    <span class="badge" id="count" hidden></span>
  </div>

  <div class="head">
    <h1>Daily Attendance</h1>
    <p>Live records from the student API.</p>
  </div>

  <div class="card">
    <div class="card-bar">
      <strong>Records</strong>
      <button class="btn" id="refreshBtn" type="button">Refresh</button>
    </div>
    <div id="daily_attendanceContainer" aria-live="polite">
      <div class="skeleton"><i></i><i></i><i></i><i></i></div>
    </div>
  </div>
</div>

<script>
  const VERCEL_API_URL = 'https://student-api-backend-mu.vercel.app/api/daily_attendance';
  const container = document.getElementById('daily_attendanceContainer');
  const countEl = document.getElementById('count');
  const refreshBtn = document.getElementById('refreshBtn');

  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const label = (k) => k.replace(/_/g, ' ');

  async function loadRecords() {
    refreshBtn.disabled = true;
    container.innerHTML = '<div class="skeleton"><i></i><i></i><i></i><i></i></div>';
    try {
      const response = await fetch(VERCEL_API_URL);
      if (!response.ok) throw new Error('Request failed');
      const records = await response.json();

      if (!records.length) {
        container.innerHTML = '<p class="state">No attendance records found.</p>';
        countEl.hidden = true;
        return;
      }

      const keys = Object.keys(records[0]).filter(k => !k.startsWith('_') && k !== '__v');
      let html = '<div class="scroll"><table><thead><tr>' + keys.map(k => '<th>' + esc(label(k)) + '</th>').join('') + '</tr></thead><tbody>';
      records.forEach((r, i) => {
        html += '<tr style="--i:' + Math.min(i, 12) + '">' + keys.map(k => '<td>' + esc(r[k]) + '</td>').join('') + '</tr>';
      });
      html += '</tbody></table></div>';
      container.innerHTML = html;

      countEl.textContent = records.length + (records.length === 1 ? ' record' : ' records');
      countEl.hidden = false;
    } catch (error) {
      container.innerHTML = '<p class="state err">Error loading records. Check your connection and press Refresh.</p>';
      countEl.hidden = true;
    } finally {
      refreshBtn.disabled = false;
    }
  }

  refreshBtn.addEventListener('click', loadRecords);
  loadRecords();
</script>
</body>
</html>
