<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        input, button { display: block; width: 100%; margin-bottom: 10px; padding: 8px; }
    </style>
</head>
<body>
    <h2><a href="index.html">Back</a></h2>
    <h2>Daily Attendance</h2>
    <div id="recordsContainer">Loading...</div>
    <script>
        const VERCEL_API_URL = 'https://student-api-backend-mu.vercel.app/api/attendance';
        async function loadRecords() {
            try {
                const response = await fetch(VERCEL_API_URL);
                const records = await response.json();
                const container = document.getElementById('recordsContainer');
                container.innerHTML = '';
                if (records.length === 0) { container.innerHTML = '<p>No attendance records found.</p>'; return; }
                records.forEach(record => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `<strong>${record.studentName || ''}</strong><br>${record.date || ''} - ${record.status || ''}`;
                    container.appendChild(div);
                });
            } catch (error) {
                document.getElementById('recordsContainer').innerText = 'Error loading records.';
            }
        }
        loadRecords();
    </script>
</body>
</html>
